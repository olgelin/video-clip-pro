name: avatar-seed
version: "1.0"
description: 数字人口播视频 — 碎碎念/口语输入，全自动（口播稿→配音→数字人→分镜→画面，无剪切）
stages:
  - name: speech_processor
    skill: speech_processor
    phase: 1
    critical: true
    retry: 2
    timeout: 300
    description: 碎碎念/口语 → 清洗纠错提炼 → 结构化口播稿 step03_script.json

  - name: voice_gen
    skill: voice_gen
    phase: 2
    critical: true
    retry: 1
    timeout: 1800
    description: VoxCPM2 配音（复用 video-factory VoxCPM2 venv）→ step05_voice.wav

  - name: lyrics_writer
    skill: lyrics_writer
    phase: 2.5
    critical: false
    retry: 1
    timeout: 300
    description: 口播稿 → 歌词（映射哲学：先挖本质→核心意象→写词，供 BGM 唱歌用）

  - name: duix
    skill: duix
    phase: 3
    critical: true
    retry: 1
    timeout: 1800
    description: Duix 数字人对口型（HTTP API 自动化）→ avatar_video.mp4

  - name: storyboard
    skill: storyboard
    phase: 4
    critical: true
    retry: 2
    timeout: 300
    description: 口播稿 + 配音时长 → 语义分镜 scenes

  - name: hf_build_avatar
    skill: hf_build_avatar
    phase: 5
    critical: false
    retry: 1
    timeout: 1200
    description: 数字人视频 + 分镜 → 全屏HTML场景 + 人物窗口 + 渲染

  - name: review
    skill: review
    phase: 6
    critical: false
    retry: 1
    timeout: 300
    description: LLM 质量审查

  - name: visual_check
    skill: visual_check
    phase: 6.2
    critical: false
    retry: 0
    timeout: 300
    description: 成片视觉质检

  - name: bgm_mix
    skill: bgm_mix
    phase: 6.5
    critical: false
    retry: 0
    timeout: 900
    description: BGM混音（ACE-Step生成+ducking，avatar默认开启）

  - name: upscale
    skill: upscale
    phase: 7
    critical: false
    retry: 0
    timeout: 1200
    description: 2x 高清修复
