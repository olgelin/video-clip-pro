name: card
version: "3.0"
description: 口播视频智能剪辑 Card — 卡片式HyperFrames（透明渐变浮空科技面板）
stages:
  - name: transcribe
    skill: transcribe
    phase: 1
    critical: true
    retry: 1
    timeout: 600
    description: Whisper 语音转录

  - name: understand
    skill: understand
    phase: 2
    critical: true
    retry: 2
    timeout: 300
    description: LLM 语义分析

  - name: draft
    skill: draft
    phase: 3
    critical: false
    retry: 2
    timeout: 300
    description: LLM EDL 精修

  - name: edit
    skill: edit
    phase: 4
    critical: true
    retry: 1
    timeout: 300
    description: ffmpeg 剪切+拼接

  - name: hf_build
    skill: hf_build
    phase: 5
    critical: false
    retry: 1
    timeout: 600
    description: HyperFrames 卡片+字幕+渲染

  - name: review
    skill: review
    phase: 6
    critical: false
    retry: 1
    timeout: 300
    description: LLM 质量审查

  - name: visual_check
    skill: visual_check
    phase: 6.2
    critical: false
    retry: 0
    timeout: 300
    description: 成片视觉质检（deepseek 视觉模型抽帧检查画面质量）

  - name: publish_meta
    skill: publish_meta
    phase: 6.3
    critical: false
    retry: 1
    timeout: 120
    description: 发布元数据（标题/描述/标签）→ publish_meta.json

  - name: lyrics_writer
    skill: lyrics_writer
    phase: 6.4
    critical: false
    retry: 1
    timeout: 300
    description: 口播稿 → 歌词（先挖本质→核心意象→写词）→ lyrics.txt

  - name: upscale
    skill: upscale
    phase: 7
    critical: false
    retry: 0
    timeout: 1200
    description: 2x 高清修复

  - name: bgm_mix
    skill: bgm_mix
    phase: 6.5
    critical: false
    retry: 0
    timeout: 900
    description: BGM混音
